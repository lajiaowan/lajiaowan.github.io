  if(act === "open-att"){
    e.preventDefault();
    openAttachment(el.getAttribute("data-pid"), el.getAttribute("data-mid"), el.getAttribute("data-i"));
    return;
  }
  if(act === "rm-mat-file"){
    e.preventDefault();
    var ri = Number(el.getAttribute("data-i"));
    if(ri >= 0 && ri < MATE_FILES.length) MATE_FILES.splice(ri, 1);
    renderMatFileList();
    return;
  }
  if(act === "import-roster"){ openRosterImport(); return; }
  if(act === "do-import"){ doRosterImport(); return; }
  if(act === "del-person"){ deletePerson(el.getAttribute("data-pid")); return; }
  if(act === "save-person"){ savePerson(el.getAttribute("data-pid")); return; }
  if(act === "toggle-edit"){ setEdit(!EDIT); return; }
  if(act === "edit-material"){ openMaterialEditor(el.getAttribute("data-pid"), el.getAttribute("data-mid")); return; }
  if(act === "save-material"){ saveMaterial(el.getAttribute("data-pid"), el.getAttribute("data-mid")); return; }
  if(act === "new-activity"){ openActivityEditor(el.getAttribute("data-pid"), null); return; }
  if(act === "edit-activity"){ openActivityEditor(el.getAttribute("data-pid"), el.getAttribute("data-idx")); return; }
  if(act === "save-activity"){ saveActivity(el.getAttribute("data-pid"), el.getAttribute("data-idx")); return; }
  if(act === "del-activity"){ deleteActivity(el.getAttribute("data-pid"), el.getAttribute("data-idx")); return; }
  if(act === "batch-manager"){ openBatchManager(); return; }
  if(act === "rename-batch"){ renameBatch(el.getAttribute("data-idx")); return; }
  if(act === "del-batch"){ deleteBatch(el.getAttribute("data-idx")); return; }
  if(act === "new-batch"){ addBatch(); return; }
  if(act === "del-log"){ deleteLog(el.getAttribute("data-idx")); return; }
  if(act === "settings"){ openSettings(""); return; }
  if(act === "save-settings"){
    var u = $("#setUser").value.trim();
    var b = $("#setBase").value.trim();
    var rEl = $("#setRole");
    var r = rEl ? rEl.value : "";
    if(u) CFG.user = u;
    CFG.base = b;
    if(r && ROLE_KEYS.indexOf(r) > -1 && r !== CFG.role){
      log("切换身份", (CFG.user || "—") + "：" + CFG.role + " → " + r);
      CFG.role = r;
    }
    saveAll();
    syncSessRole();
    closeModal();
    paintUser();
    log("修改设置", "资料库地址：" + (b || "未配置"));
    saveAll();
    toast("设置已保存");
    return;
  }
  if(act === "export-csv"){ exportCSV(); return; }
  if(act === "export-json"){ exportJSON(); return; }
  if(act === "import-json"){
    var f = $("#impFile");
    if(f) f.click();
    return;
  }
  if(act === "reset-data"){
    if(window.confirm("确定恢复演示数据？当前所有修改与日志将被覆盖，建议先导出数据快照。")){
      DB = buildData();
      LOGS = [];
      log("恢复演示数据", "重置为初始演示档案");
      saveAll();
      closeModal();
      render();
      toast("已恢复演示数据");
    }
    return;
  }
  if(act === "clear-logs"){
    if(window.confirm("确定清空全部操作日志？")){
      LOGS = [];
      log("清空日志", "操作日志已清空");
      saveAll();
      render();
      toast("日志已清空");
    }
    return;
  }
  if(act === "close-modal"){ closeModal(); return; }
  if(act === "library"){
    if(CFG.base) window.open(CFG.base, "_blank", "noopener");
    else openSettings("尚未配置资料库地址，请填写 WorkBuddy 资料库根地址。");
    return;
  }
  if(act === "logout"){ logout(); return; }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ closePop(); closeModal(); }
});

window.addEventListener("hashchange", render);

/* ---------------- 登录 / 会话 ---------------- */
function paintUser(){
  var n = CFG.user || "管理员";
  var av = $("#uavatar"), un = $("#uname"), ur = $("#urole");
  if(av) av.textContent = n.slice(0,1);
  if(un) un.textContent = n;
  if(ur){
    var rt = ur.querySelector(".rtxt");
    if(rt) rt.textContent = CFG.role || "未设定";
    ur.title = "当前身份：" + (CFG.role || "未设定") + " · 点击切换（老师 / 负责人 / 学生）";
  }
}

/* 顶栏姓名后的身份选择：老师 / 负责人 / 学生 */
function openRolePop(anchor){
  var wasOpen = popEl && popEl.classList.contains("role-pop");
  closePop();
  if(wasOpen) return;

  var el = document.createElement("div");
  el.className = "pop role-pop";
  el.innerHTML = '<div class="pop-title">切换当前身份 · ' + esc(CFG.user || "—") + '</div>' +
    ROLES.map(function(r){
      var on = CFG.role === r.k;
      return '<button class="ritem' + (on ? " cur" : "") + '" data-role="' + esc(r.k) + '">' +
        '<b>' + esc(r.k) + (on ? '<em class="ck">✓</em>' : '') + '</b>' +
        '<span>' + esc(r.d) + '</span></button>';
    }).join("");
  document.body.appendChild(el);
  popEl = el;
  anchor.classList.add("on");

  var r = anchor.getBoundingClientRect();
  var w = el.offsetWidth, h = el.offsetHeight;
  var left = Math.min(Math.max(8, r.right - w), window.innerWidth - w - 8);
  var top  = r.bottom + 6;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  el.style.left = left + "px";
  el.style.top  = top + "px";

  Array.prototype.forEach.call(el.querySelectorAll("[data-role]"), function(b){
    b.addEventListener("click", function(){ pickRole(b.getAttribute("data-role")); });
  });
}

function pickRole(k){
  if(ROLE_KEYS.indexOf(k) === -1) return;
  var old = CFG.role;
  closePop();
  if(old === k){ toast("当前身份已是「" + k + "」"); return; }
  CFG.role = k;
  log("切换身份", (CFG.user || "—") + "：" + (old || "未设定") + " → " + k);
  saveAll();
  syncSessRole();
  paintUser();
  toast("当前身份已切换为「" + k + "」");
}

function doLogin(u, p){
  var acc = ACCOUNTS.find(function(a){ return a.u === u && a.p === p; });
  if(!acc) return false;
  CFG.user = acc.name;
  CFG.role = normRole(acc.role);
  try{ localStorage.setItem(LS_SESS, JSON.stringify({ u: acc.u, role: CFG.role, t: Date.now() })); }catch(e){}
  saveAll();
  log("登录系统", acc.name + " · " + CFG.role);
  saveAll();
  enterApp();
  return true;
}

/* 会话里同步记录当前身份，刷新页面后不会被账号默认身份覆盖 */
function syncSessRole(){
  try{
    var s = JSON.parse(localStorage.getItem(LS_SESS) || "null");
    if(s && s.u){ s.role = CFG.role; s.t = Date.now(); localStorage.setItem(LS_SESS, JSON.stringify(s)); }
  }catch(e){}
}

function logout(){
  try{ localStorage.removeItem(LS_SESS); }catch(e){}
  EDIT = false;
  document.body.classList.remove("edit-mode");
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  document.body.classList.add("login-mode");
  $("#loginPass").value = "";
  $("#loginErr").textContent = "";
  currentPath = null;
  window.scrollTo(0, 0);
}

function enterApp(){
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  document.body.classList.remove("login-mode");
  paintUser();
  paintEditToggle();
  if(!location.hash) location.hash = "#/";
  render();
}

$("#loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  var u = $("#loginUser").value.trim();
  var p = $("#loginPass").value;
  if(!u || !p){ $("#loginErr").textContent = "请输入账号与密码"; return; }
  if(!doLogin(u, p)){ $("#loginErr").textContent = "账号或密码不正确，请重新输入"; return; }
});

/* ---------------- 启动 ---------------- */
(function boot(){
  loadAll();
  var sess = null;
  try{ sess = JSON.parse(localStorage.getItem(LS_SESS) || "null"); }catch(e){}
  if(sess && sess.u){
    var acc = ACCOUNTS.find(function(a){ return a.u === sess.u; });
    if(acc){
      CFG.user = acc.name;
      CFG.role = normRole(sess.role || acc.role);
      enterApp();
      return;
    }
  }
  $("#login").classList.remove("hidden");
  document.body.classList.add("login-mode");
})();
</script>
