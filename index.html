<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="X3K7hXDPOSvbwhzwNh13MM">
<head data-page-node-id="gvllZ8xuGxzoRbn3Z7r7lR">
<meta charset="UTF-8" data-page-node-id="e6ECbcGfqkmIMOF9VAZ2P1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="0zgeOsZX0TskkY39idgpJ9">
<meta name="theme-color" content="#74282A" data-page-node-id="OVTOjHc8AdsfwwQ2C0fKuH">
<title>红鸥党建工作站 · 党员发展人员档案</title>
<style>
/* ============ 基础 ============ */
:root{
  --red-900:#4E191B; --red-800:#662326; --red-700:#7C2C2E; --red-600:#8E3A3B;
  --red-tint:#F5EAE7; --red-tint-2:#FAF3F1; --red-line:#E5D2CD;
  --paper:#F7F4F0; --surface:#FFFFFF; --line:#E5DED7; --line-soft:#EFE9E3;
  --ink:#2A2420; --ink-2:#6A6157; --ink-3:#9A9188;
  --ok:#3D7350; --ok-bg:#E9F1EB; --ok-line:#C9DCCF;
  --warn:#9B731F; --warn-bg:#F8F0DC; --warn-line:#E7D6B2;
  --bad:#9C3A34; --bad-bg:#F7E7E5; --bad-line:#E8C9C5;
  --shadow:0 1px 2px rgba(78,25,27,.05), 0 10px 28px -18px rgba(78,25,27,.28);
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Source Han Serif CN","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:14px;line-height:1.62;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.hidden{display:none!important}
::selection{background:#E8D3CE}

/* ============ 登录 ============ */
body.login-mode{background:#4E191B}
.login-wrap{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:26px;
  padding:28px 20px;background:
  radial-gradient(900px 520px at 15% -10%, #92413F 0%, rgba(146,65,63,0) 62%),
  radial-gradient(800px 600px at 100% 110%, #5A1D1F 0%, rgba(90,29,31,0) 60%),
  linear-gradient(150deg,#7E2E30 0%,#662326 52%,#4E191B 100%);}
.login-card{width:100%;max-width:392px;background:var(--surface);border-radius:8px;padding:34px 32px 26px;margin-top:auto;
  box-shadow:0 30px 70px -28px rgba(0,0,0,.62);border-top:3px solid var(--red-700);position:relative}
.login-brand{display:flex;align-items:center;gap:14px}
.seal{width:40px;height:40px;flex:0 0 40px;border-radius:3px;background:var(--red-700);color:#F8F0E9;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;line-height:1.05;
  letter-spacing:0;text-align:center;font-weight:600;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.seal.big{width:52px;height:52px;flex:0 0 52px;font-size:17px}
.login-brand h1{font-family:var(--serif);font-size:19px;letter-spacing:1px;font-weight:600}
.login-brand p{font-size:12px;color:var(--ink-3);letter-spacing:1.5px;margin-top:1px}
.login-rule{height:1px;background:var(--line);margin:22px 0 18px}
.fl{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px;letter-spacing:.5px}
.linp{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:#FCFAF8;
  outline:none;transition:border-color .15s,background .15s;margin-bottom:14px;font-size:14px}
.linp:focus{border-color:var(--red-600);background:#fff}
.lbtn{width:100%;height:42px;border:0;border-radius:4px;background:var(--red-700);color:#FBF4EF;
  font-size:15px;letter-spacing:4px;font-weight:600;transition:background .15s}
.lbtn:hover{background:var(--red-800)}
.lerr{color:var(--bad);font-size:12.5px;min-height:18px;margin:-6px 0 8px}
.lnote{margin-top:18px;font-size:11.5px;color:var(--ink-3);line-height:1.7;padding-top:14px;border-top:1px dashed var(--line)}
.lfoot{color:rgba(255,255,255,.62);font-size:11.5px;letter-spacing:1px;text-align:center;margin-bottom:auto}

/* ============ 顶栏 ============ */
.topbar{background:linear-gradient(180deg,#843234 0%,#74282A 60%,#6A2325 100%);color:#F7EEE8;
  border-bottom:2px solid #4E191B}
.topbar-in{max-width:1240px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:18px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-txt{min-width:0}
.brand-txt h1{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.8px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.brand-txt p{font-size:11px;letter-spacing:1.4px;color:rgba(255,255,255,.66);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.tbtn{background:transparent;border:1px solid rgba(255,255,255,.28);color:#F7EEE8;border-radius:4px;
  padding:5px 12px;font-size:12.5px;letter-spacing:.5px;transition:background .15s,border-color .15s;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5)}
.tbtn.ghost{border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.8)}
.userchip{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:999px;
  background:rgba(255,255,255,.12);white-space:nowrap}
.avatar{width:26px;height:26px;border-radius:50%;background:#F3E4DC;color:var(--red-800);display:flex;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:600;font-family:var(--serif)}
.userchip b{font-size:12.5px;font-weight:600}
.userchip i{font-style:normal;font-size:11px;opacity:.66;margin-left:2px}
.rolepick{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:2px 4px;margin-left:-2px;
  border-radius:3px;color:rgba(255,255,255,.72);font-size:11px;font-family:inherit;letter-spacing:.3px;cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap}
.rolepick .sep{opacity:.55;margin-right:1px}
.rolepick .car{font-size:8px;opacity:.75;line-height:1;transform:translateY(-1px)}
.rolepick:hover{background:rgba(255,255,255,.16);color:#fff}
.rolepick.on{background:rgba(255,255,255,.2);color:#fff}
.pop.role-pop{width:206px;padding:6px}
.role-pop .ritem{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:3px;line-height:1.35}
.role-pop .ritem b{display:block;font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:.3px}
.role-pop .ritem b .ck{float:right;font-style:normal;font-size:11px;color:var(--red-700);line-height:1.5}
.role-pop .ritem span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.role-pop .ritem.cur{background:var(--red-tint)}
.role-pop .ritem.cur b{color:var(--red-700)}
.role-pop .ritem:not(.cur):hover{background:var(--paper)}

/* ============ 二级导航 ============ */
.subnav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.subnav-in{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.subnav-in::-webkit-scrollbar{display:none}
.subnav a{padding:11px 0 9px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;
  white-space:nowrap;transition:color .15s,border-color .15s}
.subnav a:hover{color:var(--red-700)}
.subnav a.on{color:var(--red-700);font-weight:600;border-bottom-color:var(--red-700)}

/* ============ 主区域 ============ */
.main{max-width:1240px;margin:0 auto;padding:22px 24px 54px}
.foot{text-align:center;font-size:11.5px;color:var(--ink-3);letter-spacing:.6px;padding:0 20px 26px}
.pagehead{margin-bottom:18px}
.crumb{font-size:12px;color:var(--ink-3);margin-bottom:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.crumb a{color:var(--ink-2)}
.crumb a:hover{color:var(--red-700)}
.crumb i{font-style:normal;opacity:.5}
.crumb span:last-child{color:var(--ink)}
.ptitle{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:1px}
.pdesc{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.pdesc b{color:var(--red-700);font-weight:600}

/* ============ 统计卡 ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--red-700);
  border-radius:5px;padding:14px 16px 12px;box-shadow:var(--shadow)}
.stat.c-ok{border-left-color:var(--ok)}
.stat.c-warn{border-left-color:var(--warn)}
.stat.c-bad{border-left-color:var(--bad)}
.slabel{font-size:12px;color:var(--ink-2);letter-spacing:.6px}
.sval{font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:600;margin:2px 0 0;letter-spacing:.5px}
.sval span{font-size:12px;font-family:var(--sans);color:var(--ink-3);margin-left:3px;font-weight:400}
.snote{font-size:11px;color:var(--ink-3);letter-spacing:.3px}

/* ============ 入口卡 ============ */
.entries{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.entry{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:18px 20px 0;box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s;overflow:hidden}
.entry:hover{border-color:var(--red-line);box-shadow:0 2px 4px rgba(78,25,27,.06),0 16px 34px -22px rgba(78,25,27,.4)}
.entry-top{display:flex;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.eico{width:34px;height:34px;flex:0 0 34px;border-radius:4px;background:var(--red-tint);color:var(--red-700);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px;font-weight:600}
.etxt h3{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.8px}
.etxt p{font-size:12px;color:var(--ink-3);margin-top:2px}
.earrow{margin-left:auto;color:var(--red-600);font-size:15px;opacity:.7}
.entry-list{padding:12px 0 6px}
.elrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0;font-size:12.5px;color:var(--ink-2)}
.elrow b{font-weight:600;color:var(--ink);font-size:12.5px}
.nums{display:inline-flex;gap:5px;font-size:11.5px;font-family:var(--sans)}
.nums i{font-style:normal;padding:0 6px;border-radius:3px;line-height:18px}
.nums .ok{color:var(--ok);background:var(--ok-bg)}
.nums .warn{color:var(--warn);background:var(--warn-bg)}
.nums .bad{color:var(--bad);background:var(--bad-bg)}
.entry-foot{border-top:1px solid var(--line-soft);margin:auto -20px 0;padding:9px 20px;font-size:11.5px;
  color:var(--red-700);background:#FCFAF8;letter-spacing:.5px}

/* ============ 区块标题 ============ */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft);background:#FCFAF8;flex-wrap:wrap}
.sec-h h3{font-family:var(--serif);font-size:14.5px;font-weight:600;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
.sec-h h3::before{content:"";width:3px;height:13px;background:var(--red-700);border-radius:1px;display:block}
.sec-h .sp{flex:1}
.sec-b{padding:16px}
.sec-b.flush{padding:0}

/* ============ 工具条 ============ */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.inp{height:34px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0 10px;font-size:13px;
  outline:none;transition:border-color .15s;min-width:0}
.inp:focus{border-color:var(--red-600)}
.toolbar input.inp{width:220px;flex:0 0 auto}
.toolbar select.inp{padding-right:26px;cursor:pointer;width:auto;flex:0 0 auto}
.tinfo{font-size:12px;color:var(--ink-3);letter-spacing:.4px}
.legend{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.lgh{width:8px;height:8px;border-radius:2px;display:inline-block;margin-left:6px}
.lgh.ok{background:var(--ok)} .lgh.warn{background:#C79A3B} .lgh.bad{background:#B3534C}
.lgh:first-child{margin-left:0}

/* ============ 批次分组 + 人员卡 ============ */
.batch{margin-bottom:24px}
.batchhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.batchhead h3{font-family:var(--serif);font-size:14.5px;font-weight:600;letter-spacing:.6px;
  display:inline-flex;align-items:baseline;gap:6px;cursor:pointer;user-select:none;padding:2px 0}
.batchhead h3:hover .bh-term{color:var(--ink-2)}
/* 期数比学期字号更大，便于快速定位 */
.bh-term{font-size:12.5px;color:var(--ink-3);font-weight:500;letter-spacing:.3px}
.bh-period{font-size:22px;line-height:1;font-weight:700;color:var(--red-800);letter-spacing:.5px}
.bh-period em{font-style:normal;font-size:13px;font-weight:600;margin-left:1px}
.batchhead .bh-tools{display:flex;align-items:center;gap:6px}
.batchhead .bh-toggle{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:4px 7px;border-radius:4px;
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.3px}
.batchhead .bh-toggle:hover{background:var(--line-soft);color:var(--ink-2)}
.bh-toggle .car{display:inline-block;font-size:10px;transition:transform .18s}
.batch.collapsed .bh-toggle .car{transform:rotate(-90deg)}
.batch.collapsed .pgrid-cards{display:none}
.batch.collapsed{margin-bottom:14px}
.batch.collapsed .batchhead{margin-bottom:0}
.batch.collapsed .bbar{opacity:.45}
.bsub{font-size:12px;color:var(--ink-3)}
.bbar{flex:1;min-width:70px;max-width:200px;height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden}
.bbar i{display:block;height:100%;background:var(--ok);opacity:.75;border-radius:2px}
.pgrid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.pcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:13px 14px 11px;
  transition:border-color .16s,box-shadow .16s,transform .16s;box-shadow:0 1px 2px rgba(78,25,27,.04)}
.pcard:hover{border-color:var(--red-line);box-shadow:0 8px 20px -14px rgba(78,25,27,.5)}
.pcard-h{display:flex;align-items:baseline;gap:8px}
.pname{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:1px}
.pno{margin-left:auto;font-size:11px;color:var(--ink-3);letter-spacing:.5px;font-family:var(--sans)}
.pmeta{font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfoot{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-soft)}
.dots{display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.warn{background:#C79A3B} .dot.bad{background:#B3534C}
.pct{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:var(--sans)}
.pct b{color:var(--ink-2);font-weight:600}
.badge{font-size:10.5px;padding:1px 6px;border-radius:3px;letter-spacing:.4px;border:1px solid;line-height:16px}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.badge.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.badge.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}

/* ============ 状态标签 ============ */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;
  border:1px solid var(--line);background:#FCFAF8;color:var(--ink-2);letter-spacing:.2px;line-height:18px;
  transition:box-shadow .15s,border-color .15s;white-space:nowrap}
button.pill:hover{box-shadow:0 0 0 3px rgba(124,44,46,.08)}
.pill .em{font-size:9px;line-height:1}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.pill.sm{padding:1px 7px;font-size:11px;line-height:17px}

/* ============ 人员档案详情 ============ */
.profile{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.profile-top{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,#FBF6F4 0%,#fff 100%);flex-wrap:wrap}
.pface{width:52px;height:52px;flex:0 0 52px;border-radius:4px;background:var(--red-700);color:#F8F0E9;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;letter-spacing:1px}
.pid-txt h2{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:2px}
.pid-txt p{font-size:12px;color:var(--ink-3);margin-top:2px;letter-spacing:.6px}
.ptags{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:3px;background:var(--red-tint);color:var(--red-700);
  border:1px solid var(--red-line);letter-spacing:.4px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr)}
.pcell{padding:12px 20px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.pcell:nth-child(3n){border-right:0}
.pcell span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.6px;margin-bottom:2px}
.pcell b{font-size:13.5px;font-weight:500;letter-spacing:.3px}

/* 材料行 */
.mrow{display:grid;grid-template-columns:38px minmax(0,1fr) auto auto;gap:0 14px;align-items:center;
  padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:#FCFAF8}
.mico{width:32px;height:32px;border-radius:4px;background:var(--red-tint-2);border:1px solid var(--red-line);
  display:flex;align-items:center;justify-content:center;font-size:14px}
.mname{font-size:13.5px;font-weight:500;letter-spacing:.3px}
.mnote{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.mmeta{font-size:11px;color:var(--ink-3)}
.mstatus{display:flex;justify-content:flex-end}
.mfile{display:flex;justify-content:flex-end;min-width:88px}
.flink{border:0;background:none;padding:0;font-size:12px;color:var(--red-700);letter-spacing:.3px;
  border-bottom:1px solid var(--red-line);line-height:1.5}
.flink:hover{color:var(--red-900);border-color:var(--red-700)}
.flink.off{color:var(--ink-3);border-bottom-color:var(--line);cursor:not-allowed}

/* ---- 材料附件（多文件） ---- */
.mfile-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.fchip{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:11px;color:var(--ink-2);
  background:#FBF7F4;border:1px solid var(--line);border-radius:4px;padding:2px 6px;cursor:pointer;line-height:17px}
.fchip:hover{border-color:var(--red-line);color:var(--red-700)}
.fchip .fi{font-size:10px;line-height:1}
.fchip .fn{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip .fsz{color:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}
.fchip .fx{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:12px;line-height:1;padding:0 1px}
.fchip .fx:hover{color:#B3534C}
.fchip.new{border-style:dashed;border-color:var(--red-line);background:#FDF7F5}

.tbl-min{min-width:760px}
.tbl-ledger{min-width:1080px}

.loglist{padding:4px 0}

.arw{color:var(--red-600);padding:0 2px;font-weight:600}
.probtag{background:#F3E4DC;border-color:#E3C7BC;color:var(--red-800);font-weight:600}
.only-mobile{display:none}

  .only-desktop{display:none}

}

/* ============ 空状态 ============ */
.empty{padding:52px 20px;text-align:center;color:var(--ink-3)}

.empty .e2{font-size:12px}

/* ============ 弹层 ============ */
.pop{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:5px;width:176px;
  box-shadow:0 16px 40px -14px rgba(78,25,27,.42);padding:5px}
.pop-title{font-size:10.5px;color:var(--ink-3);padding:4px 8px 6px;border-bottom:1px solid var(--line-soft);

.pop button{display:flex;width:100%;align-items:center;gap:8px;padding:6px 8px;border:0;background:none;
  border-radius:3px;font-size:12.5px;text-align:left;color:var(--ink)}
.pop button:hover{background:var(--paper)}
.pop button.cur{background:var(--red-tint);color:var(--red-700);font-weight:600}
.pop button .em{font-size:9px}
.mask{position:fixed;inset:0;background:rgba(42,36,32,.44);z-index:400;display:flex;align-items:center;
  justify-content:center;padding:20px;overflow:auto}
.modal{background:#fff;border-radius:6px;width:100%;max-width:470px;box-shadow:0 30px 70px -24px rgba(0,0,0,.5);
  border-top:3px solid var(--red-700);max-height:88vh;overflow:auto}
.modal-h{padding:16px 20px 12px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.modal-h h3{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:1px}
.modal-h .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--ink-3);line-height:1;padding:0 2px}
.modal-b{padding:16px 20px}
.modal-f{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px;letter-spacing:.4px}
.field .inp{width:100%;height:36px}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.65;margin-top:5px}
.divider{height:1px;background:var(--line-soft);margin:16px 0}
.btn{height:34px;padding:0 16px;border-radius:4px;border:1px solid var(--line);background:#fff;font-size:13px;
  letter-spacing:.5px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--red-line);background:#FCFAF8}
.btn.primary{background:var(--red-700);border-color:var(--red-700);color:#FBF4EF;font-weight:600}
.btn.primary:hover{background:var(--red-800);border-color:var(--red-800)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}

.opgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opgrid .btn{width:100%}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,10px);background:#2A2420;color:#fff;
  padding:9px 16px;border-radius:4px;font-size:12.5px;letter-spacing:.4px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:500;max-width:86vw;text-align:center;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}

.tbtn.edit-toggle{display:inline-flex;align-items:center;gap:6px}
.tbtn.edit-toggle .sw{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.42);transition:background .15s}
.tbtn.edit-toggle.on{background:#F3E4DC;border-color:#F3E4DC;color:var(--red-800);font-weight:600}

.edit-toggle .ls{display:none}

  letter-spacing:.3px;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.ebtn:hover{border-color:var(--red-line);color:var(--red-700);background:#FCFAF8}

}

<script>
/* =========================================================
   红鸥党建工作站 · 党员发展人员档案
   单文件应用：数据持久化于 localStorage，可导出/导入快照
   ========================================================= */
"use strict";

/* ---------------- 常量 ---------------- */
var LS_DB   = "hongou.archives.v2";
var LS_CFG  = "hongou.config.v2";
var LS_LOG  = "hongou.logs.v2";
var LS_SESS = "hongou.session.v2";

var MATERIALS = [
  { id:"apply",     name:"入党申请书",           short:"入党申请书", icon:"📄" },
  { id:"report",    name:"思想汇报",             short:"思想汇报",   icon:"📝" },
  { id:"talk",      name:"谈话记录",             short:"谈话记录",   icon:"🗣️" },
  { id:"cultivate", name:"积极分子培养考察表",   short:"培养考察表", icon:"📋" },
  { id:"cert",      name:"结业证书",             short:"结业证",     icon:"🎓" },
  { id:"activity",  name:"活动参与记录",         short:"活动台账",   icon:"🚩" }
];

var ST = {
  done:    { label:"已完成", em:"✅", cls:"ok"   },
  revise:  { label:"修改中", em:"🟡", cls:"warn" },
  missing: { label:"未交",   em:"🔴", cls:"bad"  }
};

var FILE_NAME = {
  apply:"01_入党申请书.pdf",
  report:"02_思想汇报.pdf",
  talk:"03_谈话记录.pdf",
  cultivate:"04_培养考察表.pdf",
  cert:"05_结业证书.pdf",
  activity:"06_活动参与记录.pdf"
};

var ROLES = [
  { k:"老师",   d:"指导教师 · 查阅与指导档案" },
  { k:"负责人", d:"支部负责人 · 维护档案与批次" },
  { k:"学生",   d:"积极分子 · 查看本人档案" }
];
var ROLE_KEYS = ROLES.map(function(r){ return r.k; });

var ACCOUNTS = [
  { u:"admin",     p:"123456", name:"王振华", role:"负责人" },
  { u:"zuzhi",     p:"123456", name:"李文静", role:"老师" },
  { u:"xuanchuan", p:"123456", name:"张海涛", role:"学生" }
];

/* 旧数据里的职务名映射到三类身份，避免出现菜单里选不中的第四种角色 */
var ROLE_ALIAS = {
  "支部书记":"负责人", "副书记":"负责人", "组织委员":"老师", "宣传委员":"老师",
  "辅导员":"老师", "指导教师":"老师", "管理员":"负责人", "积极分子":"学生"
};
function normRole(r){
  if(ROLE_KEYS.indexOf(r) > -1) return r;
  return ROLE_ALIAS[r] || "负责人";
}

/* ---------------- 工具 ---------------- */
function $(s, r){ return (r||document).querySelector(s); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function pad2(n){ return String(n).padStart(2,"0"); }
function nowStamp(){
  var d = new Date();
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function dateStamp(){
  var d = new Date();
  return ""+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate());
}
function toast(msg){
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

/* ---------------- 状态与数据 ---------------- */
var DB  = null;
var CFG = { user:"王振华", role:"负责人", base:"" };
var LOGS = [];
var state = { q:"", batch:"全部", mq:"", mbatch:"全部", lq:"", lbatch:"全部", logQ:"", logUser:"全部", logAct:"全部" };
var currentPath = null;
var EDIT = false;   /* 编辑模式：开启后可增删改人员、材料明细、活动记录与批次 */

/* 批次折叠状态（本地记忆，刷新后保持） */
var LS_UI = "hongou.ui.v1";
var BCOL = {};
try{ var _ui = localStorage.getItem(LS_UI); if(_ui){ BCOL = JSON.parse(_ui) || {}; } }catch(e){ BCOL = {}; }
function saveBcol(){ try{ localStorage.setItem(LS_UI, JSON.stringify(BCOL)); }catch(e){} }
function isCollapsed(key){ return !!BCOL[key]; }
function toggleBatch(key){
  if(!key) return;
  BCOL[key] = !BCOL[key];
  saveBcol();
  paintPersons();
}

/* 批次名拆成「学期」+「期数」，期数单独放大显示 */
function batchParts(b){
  var s = String(b || "");
  var m = s.match(/^(.+?)[—–\-－]+(.+)$/);
  if(m && /期/.test(m[2])) return { term:m[1].trim(), period:m[2].trim() };
  return { term:"", period:s };
}
function batchTitleHTML(b){
  var x = batchParts(b);
  if(!x.term) return '<span class="bh-term" style="font-size:15px;color:var(--ink);font-weight:600">' + esc(x.period || b) + '</span>';
  var mm = x.period.match(/^(\d+)(.*)$/);
  var phtml = mm ? mm[1] + '<em>' + esc(mm[2]) + '</em>' : esc(x.period);
  return '<span class="bh-term">' + esc(x.term) + '</span><span class="bh-period">' + phtml + '</span>';
}

function loadAll(){
  try{
    var d = localStorage.getItem(LS_DB);
    DB = d ? JSON.parse(d) : buildData();
  }catch(e){ DB = buildData(); }

  try{
    var c = localStorage.getItem(LS_CFG);
    if(c){ var o = JSON.parse(c); if(o && typeof o === "object"){ CFG = Object.assign(CFG, o); } }
  }catch(e){}

  try{
    var l = localStorage.getItem(LS_LOG);
    if(l){ LOGS = JSON.parse(l) || []; }
  }catch(e){ LOGS = []; }

  CFG.role = normRole(CFG.role);
  normalize();
}
function saveAll(){
  try{
    localStorage.setItem(LS_DB, JSON.stringify(DB));
    localStorage.setItem(LS_CFG, JSON.stringify(CFG));
    localStorage.setItem(LS_LOG, JSON.stringify(LOGS.slice(0, 300)));
  }catch(e){ toast("本机存储空间不足，请导出台账备份"); }
}
function normalize(){
  if(!DB || !Array.isArray(DB.people)){ DB = buildData(); }
  if(!DB.meta) DB.meta = { org:"红鸥党建工作站", version:3 };
  if(!Array.isArray(DB.meta.batches)) DB.meta.batches = [];
  DB.people.forEach(function(p){
    if(!p.materials) p.materials = {};
    MATERIALS.forEach(function(m){
      if(!p.materials[m.id]) p.materials[m.id] = { status:"missing", file:"", note:"未提交", updatedAt:"", updatedBy:"", files:[] };
      if(!p.materials[m.id].status) p.materials[m.id].status = "missing";
      if(!Array.isArray(p.materials[m.id].files)) p.materials[m.id].files = [];
    });
    if(!Array.isArray(p.activities)) p.activities = [];
    if(typeof p.probation !== "boolean") p.probation = false;
    if(typeof p.probationDate !== "string") p.probationDate = "";
    if(DB.meta.batches.indexOf(p.batch) < 0) DB.meta.batches.push(p.batch);
  });
  migrateData();
}

/* 旧版演示数据（2024年第1期 这类批次名）升级到按学期命名的新内置数据。
   只在「整份数据都是旧演示批次」时替换，避免误删已经录入的真实档案。 */
function migrateData(){
  var oldName = /^\d{4}年第[12]期$/;
  var ver = (DB.meta && DB.meta.version) || 0;
  var allOldDemo = Array.isArray(DB.people) && DB.people.length > 0 &&
    DB.people.every(function(p){ return oldName.test(String(p.batch || "")); });
  if(ver < 3 && allOldDemo){
    DB = buildData();
    log("数据升级", "批次改为「25年上半年—43期」至「27年下半年—48期」，并加入预备党员标记");
    try{
      localStorage.setItem(LS_DB, JSON.stringify(DB));
      localStorage.setItem(LS_LOG, JSON.stringify(LOGS.slice(0, 300)));
    }catch(e){}
    return true;
  }
  if(DB.meta) DB.meta.version = 3;
  return false;
}

/* ---------------- 演示数据生成（固定种子，保证每次一致） ---------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function pick(rnd, arr){ return arr[Math.floor(rnd()*arr.length)]; }

function buildData(){
  var SUR = "李王张刘陈杨黄赵吴周徐孙马朱胡郭何高林罗郑梁谢宋唐许韩冯邓曹彭曾萧田董袁潘蒋蔡余杜叶程苏魏吕丁任沈姚卢姜崔钟谭陆汪范金石廖贾夏韦付方白邹孟熊秦邱江尹薛段雷侯史陶黎贺顾毛郝龚邵万钱严武戴莫孔向汤".split("");
  var GIV = ["雨欣","佳怡","宇轩","思远","文静","海涛","晓彤","泽宇","梦瑶","子涵","书瑶","志远","雅萱","明轩","若彤","嘉怡","俊杰","静怡","一诺","天宇","沐阳","语桐","昊然","玉洁","思琪","振华","若曦","家骏","心怡","书涵","立诚","婉清","卓然","云舒","慧敏","世杰","雨桐","浩然","静文","梓涵","锦程","丹青","守正","维新","晓岚","望舒","青禾","怀瑾","知微","慕白","清和"];
  var CLASSES = {
    2023:["思想政治教育2301班","计算机科学与技术2302班","法学2301班","汉语言文学2303班","会计学2302班","数学与应用数学2301班","行政管理2301班"],
    2024:["行政管理2401班","新闻学2402班","英语2401班","社会学2401班","软件工程2402班","视觉传达设计2401班","马克思主义理论2401班"],
    2025:["思想政治教育2501班","数据科学与大数据技术2501班","法学2502班","汉语言文学2501班","会计学2501班","人工智能2501班","行政管理2502班"]
  };
  var ACTS = [
    ["党史学习教育专题党课","4"],
    ["红色教育基地参观（中共一大纪念馆）","6"],
    ["主题党日：重温入党誓词","2"],
    ["志愿服务：社区助老行动","4"],
    ["理论宣讲进班级","3"],
    ["校运会志愿服务","6"],
    ["读书会：《习近平谈治国理政》","3"],
    ["乡村振兴社会调研","8"],
    ["廉洁教育专题观影","2"],
    ["迎新志愿服务","6"],
    ["五四主题团日活动","3"],
    ["支部大会：发展对象推荐","2"]
  ];
  var WEIGHT = {
    apply:    [["done",.92],["revise",.05],["missing",.03]],
    report:   [["done",.86],["revise",.10],["missing",.04]],
    talk:     [["done",.88],["revise",.08],["missing",.04]],
    cultivate:[["done",.84],["revise",.11],["missing",.05]],
    cert:     [["done",.93],["revise",.04],["missing",.03]],
    activity: [["done",.90],["revise",.07],["missing",.03]]
  };
  function weighted(rnd, list){
    var r = rnd(), acc = 0;
    for(var i=0;i<list.length;i++){ acc += list[i][1]; if(r <= acc) return list[i][0]; }
    return list[list.length-1][0];
  }
  function dayStr(rnd, base, span){
    var d = new Date(base.getTime() + Math.floor(rnd()*(span||300))*86400000);
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  }

  var rnd = mulberry32(442);
  var batches = [
    { name:"25年上半年—43期", size:8, year:2023, from:[2025,2], prob:2 },
    { name:"25年下半年—44期", size:8, year:2023, from:[2025,8], prob:2 },
    { name:"26年上半年—45期", size:8, year:2024, from:[2026,2], prob:1 },
    { name:"26年下半年—46期", size:8, year:2024, from:[2026,8], prob:1 },
    { name:"27年上半年—47期", size:8, year:2025, from:[2027,2], prob:1 },
    { name:"27年下半年—48期", size:8, year:2025, from:[2027,8], prob:1 }
  ];
  var used = {}, people = [], gid = 0;
  var OPER = ["王振华","李文静","张海涛","陈静"];

  batches.forEach(function(b){
    var startIdx = people.length;
    for(var i=0;i<b.size;i++){
      gid++;
      var name = "", guard = 0;
      do { name = pick(rnd, SUR) + pick(rnd, GIV); guard++; } while(used[name] && guard < 300);
      used[name] = 1;

      var stMap = {};
      MATERIALS.forEach(function(m){ stMap[m.id] = weighted(rnd, WEIGHT[m.id]); });

      /* 活动记录：与「活动参与记录」材料状态保持一致 */
      var acts = [], an = 3 + Math.floor(rnd()*5), put = {};
      if(stMap.activity !== "missing"){
        for(var k=0;k<an;k++){
          var ai = Math.floor(rnd()*ACTS.length), guard3 = 0;
          while(put[ai] && guard3 < 20){ ai = Math.floor(rnd()*ACTS.length); guard3++; }
          put[ai] = 1;
          acts.push({ date: dayStr(rnd, new Date(b.from[0], b.from[1], 1), 330), title: ACTS[ai][0], hours: Number(ACTS[ai][1]) });
        }
        acts.sort(function(x,y){ return x.date < y.date ? 1 : -1; });
      }
      var actHours = acts.reduce(function(s,a){ return s + a.hours; }, 0);

      var mat = {};
      MATERIALS.forEach(function(m){
        var st = stMap[m.id];
        var file = st === "missing" ? "" : FILE_NAME[m.id];
        var note = "";
        if(m.id === "apply"){
          note = st === "missing" ? "未提交" : "手写原件扫描件";
        } else if(m.id === "report"){
          var c = st === "missing" ? 0 : (st === "revise" ? 2 : 4);
          note = st === "missing" ? "未提交" : (c + "/4 篇");
        } else if(m.id === "talk"){
          var t = st === "missing" ? 0 : (st === "revise" ? 1 : 2);
          note = st === "missing" ? "未提交" : (t + " 次谈话记录");
        } else if(m.id === "cultivate"){
          note = st === "missing" ? "未提交" : "第 1—2 季度考察意见";
        } else if(m.id === "cert"){
          note = st === "missing" ? "未提交" : "党校第 " + (12 + (gid % 5)) + " 期结业";
        } else {
          note = st === "missing" ? "未提交" : (acts.length + " 次 · " + actHours + " 学时");
        }
        mat[m.id] = {
          status: st,
          file: file,
          note: note,
          updatedAt: st === "missing" ? "" : dayStr(rnd, new Date(b.from[0], b.from[1], 1), 300),
          updatedBy: st === "missing" ? "" : pick(rnd, OPER)
        };
      });

      people.push({
        id: "p" + gid,
        seq: pad2(i+1),
        batch: b.name,
        name: name,
        sid: String(b.year) + String(gid).padStart(4,"0"),
        cls: pick(rnd, CLASSES[b.year]),
        phone: "1" + pick(rnd,["3","5","7","8","9"]) + String(Math.floor(rnd()*1e9)).padStart(9,"0"),
        probation: false,
        probationDate: "",
        materials: mat,
        activities: acts
      });
    }

    /* 本批预备党员：从材料最完整的成员中标记，仍在原批次内，只是单独分组展示 */
    var arr = people.slice(startIdx);
    arr.slice().sort(function(x,y){ return doneCount(y) - doneCount(x); })
      .slice(0, Math.min(b.prob || 0, arr.length))
      .forEach(function(q){
        q.probation = true;
        q.probationDate = dayStr(rnd, new Date(b.from[0], b.from[1], 1), 420);
      });
  });

  return {
    meta: { org:"红鸥党建工作站", version:3, createdAt: nowStamp(), updatedAt: nowStamp(),
            batches: batches.map(function(b){ return b.name; }) },
    people: people
  };
}

/* ---------------- 判定函数 ---------------- */
function matOf(p){ return MATERIALS.map(function(m){ return p.materials[m.id]; }); }
function isComplete(p){ return MATERIALS.every(function(m){ return p.materials[m.id].status === "done"; }); }
function hasMissing(p){ return MATERIALS.some(function(m){ return p.materials[m.id].status === "missing"; }); }
function hasRevise(p){ return MATERIALS.some(function(m){ return p.materials[m.id].status === "revise"; }); }
function doneCount(p){ return MATERIALS.filter(function(m){ return p.materials[m.id].status === "done"; }).length; }
function personState(p){
  if(isComplete(p)) return "ok";
  if(hasMissing(p)) return "bad";
  return "warn";
}
function personStateText(p){
  var s = personState(p);
  return s === "ok" ? "档案齐全" : (s === "bad" ? "待补交" : "待修改");
}
function batchList(){
  if(DB && DB.meta && Array.isArray(DB.meta.batches) && DB.meta.batches.length) return DB.meta.batches.slice();
  return Array.from(new Set(DB.people.map(function(p){ return p.batch; })));
}
function findPerson(id){ return DB.people.find(function(p){ return p.id === id; }); }
function findMat(id){ return MATERIALS.find(function(m){ return m.id === id; }); }

function pillHTML(status, extra){
  var s = ST[status] || ST.missing;
  return '<span class="pill ' + s.cls + (extra ? " " + extra : "") + '"><span class="em">' + s.em + '</span>' + s.label + '</span>';
}
function pillBtn(pid, mid, status, extra){
  var s = ST[status] || ST.missing;
  return '<button class="pill ' + s.cls + (extra ? " " + extra : "") + '" data-act="status" data-pid="' + pid +
         '" data-mid="' + mid + '"><span class="em">' + s.em + '</span>' + s.label + '</button>';
}

/* ---------------- 日志 ---------------- */
/* pid/pname：本条操作涉及的档案，用于在日志里直接跳转到该人档案 */
function log(act, detail, pid, pname){
  LOGS.unshift({
    ts: nowStamp(), user: CFG.user || "系统", role: CFG.role || "",
    act: act, detail: detail || "",
    pid: pid || "", pname: pname || ""
  });
  if(LOGS.length > 300) LOGS.length = 300;
}

/* ---------------- 路由 ---------------- */
function render(){
  var raw = location.hash.replace(/^#/, "") || "/";
  var parts = raw.split("/").filter(Boolean);
  var seg1 = parts[0] || "home";
  var seg2 = parts[1] || "";

  closePop();
  var changed = raw !== currentPath;
  currentPath = raw;

  if(seg1 === "persons")        viewPersons();
  else if(seg1 === "person")    viewPerson(seg2);
  else if(seg1 === "materials") viewMaterials();
  else if(seg1 === "material")  viewMaterial(seg2);
  else if(seg1 === "ledger")    viewLedger();
  else if(seg1 === "logs")      viewLogs();
  else                          viewHome();

  setNav(seg1);
  if(changed) window.scrollTo(0, 0);
}

function setNav(seg1){
  var map = { home:"home", persons:"persons", person:"persons", materials:"materials", material:"materials", ledger:"ledger", logs:"logs" };
  var cur = map[seg1] || "home";
  Array.prototype.forEach.call(document.querySelectorAll("#subnav a"), function(a){
    a.classList.toggle("on", a.getAttribute("data-nav") === cur);
  });
}

/* ---------------- 视图：工作台 ---------------- */
function viewHome(){
  var total = DB.people.length, complete = 0, miss = 0, rev = 0;
  DB.people.forEach(function(p){
    if(isComplete(p)) complete++;
    else if(hasMissing(p)) miss++;
    else rev++;
  });
  var batches = batchList();

  var batchRows = batches.map(function(b){
    var arr = DB.people.filter(function(p){ return p.batch === b; });
    var d = arr.filter(isComplete).length;
    return '<div class="elrow"><span>' + esc(b) + '</span><span class="nums">' +
           '<i class="ok">' + d + '/' + arr.length + '</i></span></div>';
  }).join("");

  var matRows = MATERIALS.map(function(m){
    var c = { done:0, revise:0, missing:0 };
    DB.people.forEach(function(p){ c[p.materials[m.id].status] = (c[p.materials[m.id].status]||0) + 1; });
    return '<div class="elrow"><span>' + m.icon + " " + esc(m.short) + '</span><span class="nums">' +
           '<i class="ok">' + c.done + '</i><i class="warn">' + c.revise + '</i><i class="bad">' + c.missing + '</i>' +
           '</span></div>';
  }).join("");

  var recent = LOGS.slice(0, 6);

  view.innerHTML =
  '<div class="pagehead">' +

/* ---------------- 视图：按人员 ---------------- */
function passFilter(p, q, batch){
  if(batch !== "全部" && p.batch !== batch) return false;
  if(!q) return true;
  var s = q.toLowerCase();
  return p.name.indexOf(q) > -1 || p.sid.indexOf(q) > -1 || p.cls.indexOf(q) > -1 || p.phone.indexOf(q) > -1;
}

function viewPersons(){
  var batches = batchList();
  var probN = DB.people.filter(function(p){ return p.probation; }).length;
  view.innerHTML =
  '<div class="pagehead">' +
    '<div class="crumb"><a href="#/">工作台</a><i>/</i><span>按人员查看</span></div>' +
    '<div class="hd-row"><h2 class="ptitle">党员发展人员档案</h2>' +
      (EDIT ? '<div class="page-actions">' +
        '<button class="ebtn solid" data-act="import-roster">＋ 批量导入名单</button>' +
        '<button class="ebtn" data-act="new-person">新增单个人员</button>' +
        '<button class="ebtn" data-act="batch-manager">批次管理</button>' +
      '</div>' : '') +
    '</div>' +
    '<p class="pdesc">共 <b>' + DB.people.length + '</b> 人 · ' + batches.length + ' 个批次' +
      (probN ? ' · 其中预备党员 <b>' + probN + '</b> 人（单独置顶列出，同时计入各批次）' : '') +
      '。点击人员卡片查看其全套档案。</p>' +
  '</div>' +

    '<input class="inp" id="q" type="text" placeholder="搜索姓名 / 学号 / 班级" value="' + esc(state.q) + '">' +
    '<select class="inp" id="bsel">' + ["全部"].concat(batches).map(function(b){
      return '<option value="' + esc(b) + '"' + (state.batch === b ? " selected" : "") + '>' + esc(b) + '</option>';
    }).join("") + '</select>' +
    '<span class="tinfo" id="tinfo"></span>' +
    '<span class="legend"><i class="lgh ok"></i>已完成<i class="lgh warn"></i>修改中<i class="lgh bad"></i>未交</span>' +
  '</div>' +
  '<div id="plist"></div>';

  $("#q").addEventListener("input", function(e){ state.q = e.target.value.trim(); paintPersons(); });
  $("#bsel").addEventListener("change", function(e){ state.batch = e.target.value; paintPersons(); });

function paintPersons(){
  var list = DB.people.filter(function(p){ return passFilter(p, state.q, state.batch); });
  $("#tinfo").textContent = "筛选结果 " + list.length + " 人";

  if(!list.length){
    $("#plist").innerHTML = '<div class="sec"><div class="empty"><div class="e1">未找到匹配的人员</div><div class="e2">请调整姓名关键词或批次筛选条件</div></div></div>';
    return;
  }

  var batches = batchList(), html = "";

  /* 预备党员单独置顶分组：这些人同时也属于原批次，后面仍会出现在各自批次里 */
  var prob = list.filter(function(p){ return p.probation; });
  if(prob.length){
    var pk = "__prob__", pc = isCollapsed(pk);
    html += '<section class="batch prob-batch' + (pc ? " collapsed" : "") + '">' +
      '<div class="batchhead">' +
        '<h3 data-act="toggle-batch" data-b="' + pk + '"><span class="bh-term" style="font-size:15px;color:var(--red-800);font-weight:600">预备党员</span><span class="btag">单独列出</span></h3>' +
        '<span class="bsub">' + prob.length + ' 人 · 仍计入下方各批次统计</span>' +
        '<button class="bh-toggle" data-act="toggle-batch" data-b="' + pk + '" style="margin-left:auto"><span class="car">▾</span>' + (pc ? "展开" : "收起") + '</button>' +
      '</div>' +
      '<div class="pgrid-cards">' + prob.map(function(p){ return personCard(p, true); }).join("") + '</div>' +
    '</section>';
  }

  batches.forEach(function(b){
    var arr = list.filter(function(p){ return p.batch === b; });
    if(!arr.length) return;
    var d = arr.filter(isComplete).length;
    var col = isCollapsed(b);
    var tools = EDIT
      ? '<span class="bh-tools">' +
          '<button class="ebtn mini" data-act="new-person" data-batch="' + esc(b) + '">＋ 添加人员</button>' +
        '</span>'
      : '';
    html += '<section class="batch' + (col ? " collapsed" : "") + '">' +
      '<div class="batchhead">' +
        '<h3 data-act="toggle-batch" data-b="' + esc(b) + '">' + batchTitleHTML(b) + '</h3>' +
        '<span class="bsub">' + arr.length + ' 人 · 档案齐全 ' + d + ' 人</span>' +
        '<div class="bbar"><i style="width:' + Math.round(d / arr.length * 100) + '%"></i></div>' +
        tools +
        '<button class="bh-toggle" data-act="toggle-batch" data-b="' + esc(b) + '"><span class="car">▾</span>' + (col ? "展开" : "收起") + '</button>' +
      '</div>' +
      '<div class="pgrid-cards">' + arr.map(function(p){ return personCard(p); }).join("") + '</div>' +
    '</section>';
  });
  $("#plist").innerHTML = html;
}

function personCard(p, showBatch){
  var dots = MATERIALS.map(function(m){
    var it = p.materials[m.id];
    return '<i class="dot ' + ST[it.status].cls + '" title="' + esc(m.name) + '：' + ST[it.status].label + '"></i>';
  }).join("");
  var tools = EDIT
    ? '<div class="pcard-tools">' +
        '<button class="ebtn mini" data-act="edit-person" data-pid="' + p.id + '">编辑</button>' +
        '<button class="ebtn mini" data-act="new-activity" data-pid="' + p.id + '">＋活动</button>' +
        '<button class="ebtn mini danger" data-act="del-person" data-pid="' + p.id + '" style="margin-left:auto">删除</button>' +
      '</div>'
    : '';
  return '<div class="pcard">' +
    '<a class="pcard-link" href="#/person/' + p.id + '">' +
      '<div class="pcard-h"><span class="pname">' + esc(p.name) + '</span>' +

        (showBatch ? esc(p.batch) + ' · ' : '') + esc(p.sid) + ' · ' + esc(p.cls) + '</div>' +
      '<div class="pfoot"><div class="dots">' + dots + '</div>' +
        '<span class="pct"><b>' + doneCount(p) + '</b>/6 项</span></div>' +
    '</a>' + tools +
  '</div>';
}

/* 单个人物的操作留痕 */
function detailHTML(d){

}
function personLogBlock(p){
  var rel = LOGS.filter(function(l){ return l.pid === p.id; }).slice(0, 8);
  if(!rel.length){
    return '<div class="empty" style="padding:24px"><div class="e1">暂无操作记录</div>' +
           '<div class="e2">材料状态变更、信息修改、活动录入都会在此留痕</div></div>';
  }
  var table = '<div class="only-desktop"><div class="tw"><table class="mini logtbl"><thead><tr>' +
    '<th style="width:132px">时间</th><th style="width:112px">操作人</th><th style="width:130px">操作</th><th>内容</th>' +
    '</tr></thead><tbody>' + rel.map(function(l){
      return '<tr><td class="dim">' + esc(l.ts) + '</td><td>' + esc(l.user) + (l.role ? '<span class="lrole">' + esc(l.role) + '</span>' : '') +
             '</td><td>' + esc(l.act) + '</td><td class="dim">' + detailHTML(l.detail) + '</td></tr>';
    }).join("") + '</tbody></table></div></div>';
  var mob = '<div class="only-mobile"><div class="loglist">' + rel.map(function(l){
      return '<div class="logitem"><div class="lt">' + esc(l.ts) + ' · ' + esc(l.user) + '</div>' +
             '<div class="lc"><b>' + esc(l.act) + '</b>　' + detailHTML(l.detail) + '</div></div>';
    }).join("") + '</div></div>';
  return table + mob;
}

    '<th style="width:132px">时间</th><th style="width:94px">操作人</th><th style="width:126px">操作</th>' +

    (withDel ? '<th style="width:58px"></th>' : '') +
    '</tr></thead><tbody>' + rows.map(function(o){
      var l = o.l;
      var who = (l.pid && findPerson(l.pid))
        ? '<a class="plink" href="#/person/' + l.pid + '">' + esc(l.pname || "档案") + '</a>'
        : (l.pname ? '<span>' + esc(l.pname) + '</span>' : '<span class="dim">—</span>');
      return '<tr><td class="dim">' + esc(l.ts) + '</td>' +
             '<td>' + esc(l.user) + (l.role ? '<span class="lrole">' + esc(l.role) + '</span>' : '') + '</td>' +
             '<td>' + esc(l.act) + '</td>' +
             '<td>' + who + '</td>' +
             '<td class="dim ldet">' + detailHTML(l.detail) + '</td>' +
             (withDel ? '<td><button class="ebtn mini danger" data-act="del-log" data-idx="' + o.i + '">删除</button></td>' : '') +
             '</tr>';
    }).join("") + '</tbody></table></div></div>';

  var listHTML = '<div class="only-mobile"><div class="loglist">' + rows.map(function(o){
      var l = o.l;
      var who = (l.pid && findPerson(l.pid))
        ? '<a class="plink" href="#/person/' + l.pid + '">' + esc(l.pname || "档案") + '</a>'
        : (l.pname ? esc(l.pname) : "");
      return '<div class="logitem"><div class="lt">' + esc(l.ts) + ' · ' + esc(l.user) +
             (who ? ' · ' + who : '') +
             (withDel ? '<button class="ebtn mini danger" data-act="del-log" data-idx="' + o.i + '" style="float:right;margin-top:-2px">删除</button>' : '') +
             '</div><div class="lc"><b>' + esc(l.act) + '</b>　' + detailHTML(l.detail) + '</div></div>';

  return table + listHTML;

/* 日志筛选：操作人 + 操作类型 + 关键字 */
function logUsers(){
  var m = {};
  LOGS.forEach(function(l){ if(l.user) m[l.user] = 1; });
  return Object.keys(m);
}
function logActs(){
  var m = {};
  LOGS.forEach(function(l){ if(l.act) m[l.act] = 1; });
  return Object.keys(m);
}
function filteredLogs(){
  var q = (state.logQ || "").toLowerCase();
  return LOGS.map(function(l, i){ return { l: l, i: i }; }).filter(function(o){
    var l = o.l;
    if(state.logUser !== "全部" && l.user !== state.logUser) return false;
    if(state.logAct !== "全部" && l.act !== state.logAct) return false;
    if(!q) return true;
    return String(l.pname||"").toLowerCase().indexOf(q) > -1 ||
           String(l.detail||"").toLowerCase().indexOf(q) > -1 ||
           String(l.act||"").toLowerCase().indexOf(q) > -1 ||
           String(l.user||"").toLowerCase().indexOf(q) > -1;
  });
}

/* ---------------- 状态修改 ---------------- */
var popEl = null;
function closePop(){
  if(popEl){ popEl.remove(); popEl = null; }
  var rb = $("#urole");
  if(rb) rb.classList.remove("on");
}

function openStatusPop(anchor, pid, mid){
  closePop();
  var p = findPerson(pid); if(!p) return;
  var m = findMat(mid); if(!m) return;
  var cur = p.materials[mid].status;

  var el = document.createElement("div");
  el.className = "pop";
  el.innerHTML = '<div class="pop-title">' + esc(m.name) + ' · ' + esc(p.name) + '</div>' +
    Object.keys(ST).map(function(k){
      return '<button data-set="' + k + '" class="' + (cur === k ? "cur" : "") + '">' +
        '<span class="em">' + ST[k].em + '</span><span>' + ST[k].label + '</span></button>';
    }).join("");
  document.body.appendChild(el);
  popEl = el;

  var r = anchor.getBoundingClientRect();
  var w = el.offsetWidth, h = el.offsetHeight;
  var left = Math.min(Math.max(8, r.left + r.width/2 - w/2), window.innerWidth - w - 8);
  var top  = r.bottom + 6;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  el.style.left = left + "px";
  el.style.top  = top + "px";

  Array.prototype.forEach.call(el.querySelectorAll("[data-set]"), function(b){
    b.addEventListener("click", function(){
      var target = b.getAttribute("data-set");
      closePop();
      setStatus(pid, mid, target);
    });
  });
}

function setStatus(pid, mid, st){
  var p = findPerson(pid); if(!p) return;
  var m = findMat(mid); if(!m) return;
  var it = p.materials[mid];
  if(it.status === st) return;

  it.status = st;
  if(st === "missing"){
    it.file = "";
    it.note = "未提交";
  }else{
    if(!it.file) it.file = FILE_NAME[mid];
    if(!it.note || it.note === "未提交") it.note = st === "revise" ? "退回修改中" : "已归档";
  }
  it.updatedAt = nowStamp();
  it.updatedBy = CFG.user;

  log("修改材料状态", m.name + " → " + ST[st].label, p.id, p.name);
  saveAll();
  render();
  toast(p.name + " · " + m.name + " 已标记为「" + ST[st].label + "」");
}

/* ---------------- 附件跳转资料库 ---------------- */
function joinURL(base, parts){
  var b = String(base).replace(/\/+$/, "");
  return b + "/" + parts.map(function(x){ return encodeURIComponent(x); }).join("/");
}
function openFile(pid, mid){
  var p = findPerson(pid); if(!p) return;
  var it = p.materials[mid];
  var fl = (it && it.files) || [];
  if(fl.length && fl[0].data){ openAttachment(pid, mid, 0); return; }
  if(!it || (!it.file && !it.link)){ toast("该材料暂无电子附件"); return; }
  if(it.link){
    window.open(it.link, "_blank", "noopener");
    log("打开附件", (it.file || it.link), p.id, p.name);
    saveAll();
    return;
  }
  if(!CFG.base){
    openSettings("尚未配置 WorkBuddy 资料库地址，请先填写资料库根地址后再打开附件。");
    return;
  }
  var url = joinURL(CFG.base, [p.batch, p.name, it.file]);
  window.open(url, "_blank", "noopener");
  log("打开附件", it.file, p.id, p.name);
  saveAll();
}

/* ---------------- 导出 ---------------- */
function download(blob, filename){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 600);
}
function csvCell(v){
  var s = String(v == null ? "" : v);
  if(/^[=+\-@]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCSV(){
  var head = ["序号","批次","姓名","学号","班级","联系方式"]
    .concat(MATERIALS.map(function(m){ return m.name; }))
    .concat(["齐全项","材料状态","最近更新"]);
  var rows = sortedPeople().map(function(p){
    return [p.seq, p.batch, p.name, p.sid, p.cls, p.phone]
      .concat(MATERIALS.map(function(m){ return ST[p.materials[m.id].status].label; }))
      .concat([doneCount(p) + "/6", personStateText(p),
        String(p.materials[MED(p)].updatedAt || "").slice(0,10)]);
  });
  var csv = "\uFEFF" + [head].concat(rows).map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
  download(new Blob([csv], { type:"text/csv;charset=utf-8" }), "红鸥-积极分子档案台账-" + dateStamp() + ".csv");
  log("导出台账", "导出 CSV · " + DB.people.length + " 人");
  saveAll();
  toast("台账已导出（CSV，可用 Excel 打开）");
}
function MED(p){
  /* 取最后更新时间：遍历六项材料取最大 */
  var best = "", bestId = "apply";
  MATERIALS.forEach(function(m){
    var u = p.materials[m.id].updatedAt || "";
    if(u > best){ best = u; bestId = m.id; }
  });
  return bestId;
}
function exportJSON(){
  var payload = { meta: DB.meta, people: DB.people, logs: LOGS, exportedAt: nowStamp(), org: "红鸥党建工作站" };
  download(new Blob([JSON.stringify(payload, null, 2)], { type:"application/json;charset=utf-8" }),
    "红鸥-档案数据快照-" + dateStamp() + ".json");
  log("导出快照", "JSON 快照 · " + DB.people.length + " 人");
  saveAll();
  toast("数据快照已导出，可上传至资料库备份");
}

function nextPersonId(){

    var n = parseInt(String(p.id).replace(/[^0-9]/g, ""), 10);

}

}

function savePerson(pid){
  var isNew = !pid;
  var p = isNew ? null : findPerson(pid);
  if(!isNew && !p){ toast("人员不存在"); return; }

  var batch = $("#eBatch").value;
  var seq   = $("#eSeq").value.trim();
  var name  = $("#eName").value.trim();
  var sid   = $("#eSid").value.trim();
  var cls   = $("#eCls").value.trim();
  var ph    = $("#ePhone").value.trim();
  var probEl = $("#eProb");
  var prob  = !!(probEl && probEl.checked);

  if(!name){ toast("请填写姓名"); return; }
  if(!sid){ toast("请填写学号"); return; }
  var dup = DB.people.some(function(x){ return x.sid === sid && (!p || x.id !== p.id); });
  if(dup){ toast("学号 " + sid + " 已存在，请核对"); return; }

  if(isNew){
    if(DB.meta.batches.indexOf(batch) < 0) DB.meta.batches.push(batch);
    if(!seq) seq = pad2(DB.people.filter(function(x){ return x.batch === batch; }).length + 1);
    var np = { id: nextPersonId(), seq: seq, batch: batch, name: name, sid: sid, cls: cls, phone: ph,
               probation: prob, probationDate: prob ? dateStamp() : "",
               materials: {}, activities: [] };
    MATERIALS.forEach(function(m){
      np.materials[m.id] = { status:"missing", file:"", note:"未提交", updatedAt:"", updatedBy:"", files:[] };
    });
    DB.people.push(np);
    log("新增人员档案", "学号 " + sid + " · 批次 " + batch, np.id, name);
    saveAll(); closeModal(); render();
    toast("已新增 " + name + " 的档案，材料默认为未交");
    return;
  }

  var changes = [];
  if(batch !== p.batch) changes.push("批次 " + p.batch + "→" + batch);
  if(seq && seq !== p.seq) changes.push("序号 " + p.seq + "→" + seq);
  if(name !== p.name) changes.push("姓名 " + p.name + "→" + name);
  if(sid !== p.sid)   changes.push("学号 " + p.sid + "→" + sid);
  if(cls !== p.cls)   changes.push("班级 " + p.cls + "→" + cls);
  if(ph !== p.phone)  changes.push("联系方式 " + p.phone + "→" + ph);
  if(prob !== !!p.probation) changes.push("身份 " + (p.probation ? "预备党员" : "入党积极分子") + "→" + (prob ? "预备党员" : "入党积极分子"));
  if(!changes.length){ closeModal(); toast("未做任何修改"); return; }

  p.batch = batch; if(seq) p.seq = seq;
  p.name = name; p.sid = sid; p.cls = cls; p.phone = ph;
  if(prob !== !!p.probation){
    p.probation = prob;
    p.probationDate = prob ? (p.probationDate || dateStamp()) : "";
  }
  if(DB.meta.batches.indexOf(batch) < 0) DB.meta.batches.push(batch);
  log("编辑基础信息", changes.join("；"), p.id, name);
  saveAll(); closeModal(); render();
  toast("基础信息已更新");
}

function deletePerson(pid){
  var p = findPerson(pid); if(!p) return;
  if(!window.confirm("确认删除「" + p.name + "」（" + p.batch + "）的全部档案？\n六项材料与活动记录将一并移除，且不可撤销。")) return;
  DB.people = DB.people.filter(function(x){ return x.id !== pid; });
  log("删除人员档案", "批次 " + p.batch + " · " + p.sid + " · 六项材料及活动记录已移除", "", p.name);
  saveAll(); closeModal();

}

/* ---------------- 材料条目编辑 ---------------- */
/* 当前材料弹窗内的附件草稿（保存时才写回材料） */
var MATE_FILES = [];
var MATE_BUSY = 0;
var MAT_MAX = 2 * 1024 * 1024;   /* 单份文件内嵌上限 2MB，超过仅记录文件名 */
var MAT_ACCEPT = ".doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf,.jpg,.jpeg,.png,.gif,.webp,.bmp,.txt,.csv";

function fmtSize(n){
  if(!n) return "";
  if(n < 1024) return n + "B";
  if(n < 1048576) return Math.round(n / 1024) + "KB";
  return (n / 1048576).toFixed(1) + "MB";
}
function fileIcon(name, type){
  var e = String(name || "").split(".").pop().toLowerCase();
  if(/^(jpg|jpeg|png|gif|webp|bmp)$/.test(e) || /^image\//.test(type || "")) return "🖼";
  if(/^(doc|docx)$/.test(e)) return "📄";
  if(/^(xls|xlsx|csv)$/.test(e)) return "📊";
  if(/^(ppt|pptx)$/.test(e)) return "📽";
  if(e === "pdf") return "📕";
  return "📎";
}
function renderMatFileList(){
  var box = $("#mFileList");
  if(!box) return;
  if(!MATE_FILES.length){ box.innerHTML = '<span class="fempty">尚未添加附件</span>'; return; }
  box.innerHTML = MATE_FILES.map(function(f, i){
    return '<span class="fchip' + (f.data ? " new" : "") + '" title="' + esc(f.name) + '">' +
      '<span class="fi">' + fileIcon(f.name, f.type) + '</span>' +
      '<span class="fn">' + esc(f.name) + '</span>' +
      (f.size ? '<span class="fsz">' + fmtSize(f.size) + '</span>' : '') +
      (f.big ? '<span class="fsz">过大</span>' : '') +
      '<button class="fx" data-act="rm-mat-file" data-i="' + i + '" title="移除">×</button>' +
    '</span>';
  }).join("") + (MATE_BUSY ? '<span class="fempty">读取中…</span>' : "");
}
function addMatFiles(fl){
  var arr = Array.prototype.slice.call(fl || []);
  if(!arr.length) return;
  arr.forEach(function(f){
    if(f.size > MAT_MAX){
      MATE_FILES.push({ name:f.name, type:f.type || "", size:f.size, data:"", big:true });
      toast("「" + f.name + "」超过 2MB，仅记录文件名，可改用资料库直链");
      return;
    }
    var rec = { name:f.name, type:f.type || "", size:f.size, data:"" };
    MATE_FILES.push(rec);
    MATE_BUSY++;
    try{
      var r = new FileReader();
      r.onload = function(){ rec.data = String(r.result || ""); MATE_BUSY--; renderMatFileList(); };
      r.onerror = function(){ MATE_BUSY--; renderMatFileList(); };
      r.readAsDataURL(f);
    }catch(e){ MATE_BUSY--; }
  });
  renderMatFileList();
}

function openMaterialEditor(pid, mid){
  var p = findPerson(pid), m = findMat(mid);
  if(!p || !m) return;
  var it = p.materials[mid];
  MATE_FILES = (it.files || []).map(function(f){
    return { name:f.name, type:f.type || "", size:f.size || 0, data:f.data || "" };
  });
  MATE_BUSY = 0;

  var body =
    '<div class="field"><label>材料状态</label><select class="inp" id="mStatus">' +
      Object.keys(ST).map(function(k){
        return '<option value="' + k + '"' + (it.status === k ? " selected" : "") + '>' + ST[k].em + "  " + ST[k].label + '</option>';
      }).join("") +
    '</select></div>' +
    '<div class="field"><label>备注 / 份数</label><input class="inp" id="mNote" type="text" placeholder="如 4/4 篇、2 次谈话记录" value="' + esc(it.note || "") + '"></div>' +
    '<div class="field"><label>附件（可上传多份）</label>' +
      '<div class="fup" id="mDrop"><b>点击选择文件</b>　或把文件拖到此区域' +
        '<div class="fup-t">支持 Word / Excel / PPT / PDF / JPG / PNG / GIF 等，单份 ≤ 2MB（超出仅记录文件名）</div></div>' +
      '<input type="file" id="mFiles" multiple accept="' + MAT_ACCEPT + '" class="hidden">' +
      '<div class="mfile-chips" id="mFileList" style="margin-top:8px"></div>' +
    '</div>' +
    '<div class="field"><label>附件文件名（兼容资料库路径，可选）</label><input class="inp" id="mFile" type="text" placeholder="如 01_入党申请书.pdf" value="' + esc(it.file || "") + '">' +
      '<p class="hint">按「资料库根地址 / 批次 / 姓名 / 文件名」拼装路径打开；不上传文件时也可只登记文件名。</p></div>' +
    '<div class="field" style="margin-bottom:0"><label>附件直链（可选，优先使用）</label><input class="inp" id="mLink" type="text" placeholder="https://..." value="' + esc(it.link || "") + '">' +
      '<p class="hint">填写后附件直接打开该链接；状态改为「未交」时附件信息会自动清空。</p></div>';

  openModal(m.name + " · " + p.name, body,
    '<button class="btn" data-act="close-modal">取消</button>' +
    '<button class="btn primary" data-act="save-material" data-pid="' + pid + '" data-mid="' + mid + '">保存</button>');

  renderMatFileList();
  var fi = $("#mFiles"), dz = $("#mDrop");
  if(dz && fi){
    dz.addEventListener("click", function(){ fi.click(); });
    dz.addEventListener("dragover", function(e){ e.preventDefault(); dz.classList.add("over"); });
    dz.addEventListener("dragleave", function(){ dz.classList.remove("over"); });
    dz.addEventListener("drop", function(e){
      e.preventDefault(); dz.classList.remove("over");
      addMatFiles(e.dataTransfer && e.dataTransfer.files);
    });
    fi.addEventListener("change", function(e){ addMatFiles(e.target.files); fi.value = ""; });
  }
}

function saveMaterial(pid, mid){
  var p = findPerson(pid), m = findMat(mid);
  if(!p || !m) return;
  var it = p.materials[mid];
  var st   = $("#mStatus").value;
  var note = $("#mNote").value.trim();
  var file = $("#mFile").value.trim();
  var link = $("#mLink").value.trim();
  var files = MATE_FILES.map(function(f){
    return { name:f.name, type:f.type || "", size:f.size || 0, data:f.data || "" };
  });

  if(MATE_BUSY){ toast("附件正在读取，请稍候再保存"); return; }
  if(st !== "missing" && !file && !link && !files.length){ toast("非「未交」状态请上传附件或填写文件名 / 直链"); return; }
  if(st === "missing"){ file = ""; link = ""; files = []; if(!note) note = "未提交"; }

  /* 本机 localStorage 约 5MB，附件以 base64 内嵌，总量过大要提前提示 */
  var totalBytes = files.reduce(function(s, f){ return s + (f.data ? Math.round(f.data.length * 0.75) : 0); }, 0);
  if(totalBytes > 3.5 * 1024 * 1024){
    if(!window.confirm("当前附件合计约 " + (totalBytes / 1048576).toFixed(1) +
      " MB，可能超出浏览器本机存储上限（约 5MB），导致其他档案保存失败。\n\n建议压缩图片 / 拆分文件，或把大文件放入资料库后改用「附件直链」。仍要保存吗？")) return;
  }

  var changed = it.status !== st || (it.note || "") !== note || (it.file || "") !== file ||
                (it.link || "") !== link || JSON.stringify(it.files || []) !== JSON.stringify(files);
  if(!changed){ closeModal(); toast("未做任何修改"); return; }

  var oldLabel = ST[it.status].label;
  it.status = st; it.note = note; it.file = file; it.link = link; it.files = files;
  it.updatedAt = nowStamp(); it.updatedBy = CFG.user;
  log("编辑材料条目", m.name + " " + oldLabel + "→" + ST[st].label + (note ? " · " + note : "") +
      (files.length ? " · 附件 " + files.length + " 份" : (file ? " · 附件 " + file : "")), p.id, p.name);
  saveAll(); closeModal(); render();
  toast(p.name + " · " + m.name + " 已保存");
}

/* 打开材料附件：内嵌文件直接预览 / 下载，仅登记文件名的走资料库或直链 */
function openAttachment(pid, mid, idx){
  var p = findPerson(pid); if(!p) return;
  var it = p.materials[mid]; if(!it) return;
  var f = (it.files || [])[Number(idx)];
  if(!f) return;
  if(f.data){
    var isImg = /^image\//.test(f.type || "") || /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(f.name);
    if(isImg){
      openModal(esc(f.name), '<div class="attprev"><img src="' + f.data + '" alt="' + esc(f.name) + '"></div>',
        '<button class="btn" data-act="close-modal">关闭</button>' +
        '<a class="btn primary" href="' + f.data + '" download="' + esc(f.name) + '">下载原图</a>');
    }else{
      var a = document.createElement("a");
      a.href = f.data; a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
    }
    log("打开附件", f.name, p.id, p.name);
    saveAll();
    return;
  }
  if(it.link){ window.open(it.link, "_blank", "noopener"); return; }
  openFile(pid, mid);
}

/* ---------------- 活动记录增删改 ---------------- */
function openActivityEditor(pid, idx){
  var p = findPerson(pid); if(!p) return;
  var isNew = (idx === null || idx === undefined || idx === "");
  var a = isNew ? { date:"", title:"", hours:0 } : p.activities[Number(idx)];
  if(!a){ toast("记录不存在"); return; }
  var t = new Date();
  var dflt = a.date || (t.getFullYear() + "-" + pad2(t.getMonth()+1) + "-" + pad2(t.getDate()));
  var body =
    '<div class="field"><label>活动时间 *</label><input class="inp" id="aDate" type="date" value="' + esc(dflt) + '"></div>' +
    '<div class="field"><label>活动名称 *</label><input class="inp" id="aTitle" type="text" placeholder="如 主题党日：重温入党誓词" value="' + esc(a.title) + '"></div>' +
    '<div class="field" style="margin-bottom:0"><label>学时</label><input class="inp" id="aHours" type="number" min="0" step="1" value="' + (a.hours || 0) + '">' +
      '<p class="hint">保存后自动同步「活动参与记录」材料的次数与学时。</p></div>';
  openModal(isNew ? "新增活动记录" : "编辑活动记录", body,
    '<button class="btn" data-act="close-modal">取消</button>' +
    '<button class="btn primary" data-act="save-activity" data-pid="' + pid + '" data-idx="' + (isNew ? "" : idx) + '">保存</button>');
}

function syncActivity(p){
  var n = p.activities.length;
  var h = p.activities.reduce(function(s, x){ return s + (Number(x.hours) || 0); }, 0);
  var it = p.materials.activity;
  it.updatedAt = nowStamp(); it.updatedBy = CFG.user;
  if(n > 0){
    it.note = n + " 次 · " + h + " 学时";
    if(it.status === "missing"){ it.status = "done"; if(!it.file && !it.link) it.file = FILE_NAME.activity; }
  }else{
    it.note = "未提交"; it.status = "missing"; it.file = ""; it.link = "";
  }
}

function saveActivity(pid, idx){
  var p = findPerson(pid); if(!p) return;
  var date  = $("#aDate").value;
  var title = $("#aTitle").value.trim();
  var hours = Number($("#aHours").value || 0);
  if(!date || !title){ toast("请填写活动时间与名称"); return; }
  if(isNaN(hours) || hours < 0) hours = 0;

  var isNew = (idx === "" || idx === undefined || idx === null);
  if(isNew){
    p.activities.unshift({ date: date, title: title, hours: hours });
    log("新增活动记录", date + " " + title + "（" + hours + " 学时）", p.id, p.name);
  }else{
    var a = p.activities[Number(idx)];
    if(!a){ toast("记录不存在"); return; }
    log("编辑活动记录", a.date + " " + a.title + " → " + title, p.id, p.name);
    p.activities[Number(idx)] = { date: date, title: title, hours: hours };
  }
  p.activities.sort(function(x, y){ return x.date < y.date ? 1 : (x.date > y.date ? -1 : 0); });
  syncActivity(p);
  saveAll(); closeModal(); render();
  toast(isNew ? "已新增活动记录" : "活动记录已更新");
}

function deleteActivity(pid, idx){
  var p = findPerson(pid); if(!p) return;
  var a = p.activities[Number(idx)]; if(!a) return;
  if(!window.confirm("确定删除活动记录「" + a.title + "」（" + a.date + "）？")) return;
  p.activities.splice(Number(idx), 1);
  syncActivity(p);
  log("删除活动记录", a.date + " " + a.title, p.id, p.name);
  saveAll(); render();
  toast("活动记录已删除");
}

function renameBatch(idx){
  var list = batchList();
  var b = list[Number(idx)];
  if(b === undefined) return;
  var val = ($("#bn" + idx).value || "").trim();
  if(!val){ toast("批次名称不能为空"); return; }
  if(val === b){ toast("名称未变化"); return; }
  if(list.indexOf(val) > -1){ toast("已存在同名批次"); return; }
  var n = 0;
  DB.people.forEach(function(p){ if(p.batch === b){ p.batch = val; n++; } });
  var bi = DB.meta.batches.indexOf(b);
  if(bi > -1) DB.meta.batches[bi] = val;
  log("重命名批次", b + " → " + val + "（" + n + " 人）");
  saveAll(); render(); openBatchManager();
  toast("批次已重命名，同步更新 " + n + " 人");

function addBatch(){

  DB.meta.batches.push(val);
  log("新增批次", val);
  saveAll(); render(); openBatchManager();
  toast("已新增批次「" + val + "」");
}

function deleteBatch(idx){
  var list = batchList();
  var b = list[Number(idx)];
  if(b === undefined) return;

  if(n > 0){ toast("该批次下还有 " + n + " 人，请先转移或删除人员"); return; }
  if(!window.confirm("确定删除空批次「" + b + "」？")) return;
  DB.meta.batches = DB.meta.batches.filter(function(x){ return x !== b; });
  log("删除批次", b);
  saveAll(); render(); openBatchManager();
  toast("批次已删除");
}

/* ---------------- 批量导入：建期数 + 建人 + 建整套档案 ---------------- */
var IMPORT_ACTS = [
  ["党史学习教育专题党课", 4],
  ["主题党日：重温入党誓词", 2],
  ["志愿服务：社区助老行动", 4],
  ["红色教育基地参观", 6]
];

/* 一行 = 一人，字段顺序不限：姓名 / 学号 / 班级 / 手机号 / 序号 都能自动认 */
function parseRosterLine(line){
  var raw = String(line == null ? "" : line).replace(/^\uFEFF/, "").trim();
  if(!raw) return null;
  if(/^(#|\/\/)/.test(raw)) return null;
  raw = raw.replace(/^[（(]?\d{1,3}[）)]?\s*[.、．]\s*/, "");   /* 去掉 1. / （1）/ 1、 这类序号前缀 */

  var parts = raw.split(/[,，;；\t|]+/).map(function(s){ return s.trim(); }).filter(Boolean);
  if(parts.length <= 1){
    var sp = raw.split(/\s+/).filter(Boolean);
    if(sp.length > 1) parts = sp;
  }
  if(!parts.length) return null;
  if(parts.some(function(t){ return t === "姓名"; })) return null;   /* 表头行 */

  var r = { seq:"", name:"", sid:"", cls:"", phone:"", prob:false };
  var rest = [];
  parts.forEach(function(t, i){
    if(!r.phone && /^1[3-9]\d{9}$/.test(t)){ r.phone = t; return; }
    if(!r.sid && /^\d{6,14}$/.test(t)){ r.sid = t; return; }
    if(!r.cls && /班|系|学院/.test(t)){ r.cls = t; return; }
    if(!r.seq && i === 0 && /^\d{1,3}$/.test(t) && parts.length > 1){ r.seq = pad2(t); return; }
    rest.push(t);
  });

  var nm = rest.shift() || "";
  nm = nm.replace(/[（(]\s*预备?(党员)?\s*[）)]/g, function(){ r.prob = true; return ""; })
         .replace(/[*＊]$/, function(){ r.prob = true; return ""; })
         .replace(/\s+/g, "");
  r.name = nm;
  if(!r.name || !/[\u4e00-\u9fa5A-Za-z]/.test(r.name)) return null;
  return r;
}

function parseRoster(text){
  var rows = [];
  String(text || "").replace(/\r\n?/g, "\n").split("\n").forEach(function(l){
    var r = parseRosterLine(l);
    if(r) rows.push(r);
  });
  return rows;
}

function guessYearFromBatch(b){
  var m = String(b || "").match(/(\d{2})\s*年/);
  if(m) return String(2000 + parseInt(m[1], 10));
  return String(new Date().getFullYear());
}

/* 按「27年下半年—48期」推出下一期「28年上半年—49期」，省去手输 */
function nextBatchName(){
  var list = batchList();
  var last = list[list.length - 1] || "";
  var m = last.match(/^(\d{2})\s*年\s*(上|下)半年\s*[—\-–~]?\s*(\d+)\s*期$/);
  if(!m) return "";
  var y = parseInt(m[1], 10), q = parseInt(m[3], 10) + 1;
  if(m[2] === "上") return pad2(y) + "年下半年—" + q + "期";
  return pad2(y + 1) + "年上半年—" + q + "期";
}

/* 预览与真正导入共用同一套计算，避免看到的和导进去的不一致 */
function planRosterImport(){
  var sel = $("#impBatch");
  var batchName = !sel ? "" : (sel.value === "__new__"
    ? ($("#impBatchNew") ? $("#impBatchNew").value.trim() : "")
    : sel.value);
  var rows = parseRoster($("#impText") ? $("#impText").value : "");
  var onBtn = $("#impStatus") ? $("#impStatus").querySelector(".on") : null;
  var status = onBtn ? onBtn.getAttribute("data-st") : "missing";
  var fillFile = !$("#impFile2") || $("#impFile2").checked;
  var genActs  = !!($("#impActs") && $("#impActs").checked);

  var same = DB.people.filter(function(p){ return p.batch === batchName; });
  var maxSeq = 0;
  same.forEach(function(p){ var n = parseInt(p.seq, 10); if(!isNaN(n) && n > maxSeq) maxSeq = n; });

  /* ySrc：沿用该期已有的学号前缀；autoN：从该期最大尾号 +1 开始 */
  var ySrc = same.filter(function(p){ return /^\d{8,}$/.test(p.sid); })[0];
  var year = ySrc ? ySrc.sid.slice(0, 4) : guessYearFromBatch(batchName);
  var autoN = 1;
  if(ySrc){ var n0 = parseInt(ySrc.sid.slice(4), 10); if(!isNaN(n0) && n0 >= autoN) autoN = n0 + 1; }
  /* 名单里手填的学号先占位，自动编号要绕开它们，避免自己人撞自己人 */
  rows.forEach(function(r){
    if(!r.sid || r.sid.slice(0, 4) !== year) return;
    var n = parseInt(r.sid.slice(4), 10);
    if(!isNaN(n) && n + 1 > autoN) autoN = n + 1;
  });

  var dbSid = {}, usedSid = {}, usedName = {}, usedSeq = {};
  DB.people.forEach(function(p){ dbSid[p.sid] = 1; usedSid[p.sid] = 1; });
  rows.forEach(function(r){ if(r.sid) usedSid[r.sid] = 1; });
  same.forEach(function(p){
    usedName[p.name] = 1;
    var n = parseInt(p.seq, 10);
    if(!isNaN(n)) usedSeq[n] = 1;
  });

  var seenNow = {};
  var list = [], seqN = maxSeq;
  rows.forEach(function(r){
    var it = { seq:"", name:r.name, sid:r.sid, cls:r.cls, phone:r.phone, prob:r.prob, ok:true, note:"" };
    if(it.sid && dbSid[it.sid]){
      it.ok = false; it.note = "学号已存在，跳过";
      list.push(it); return;
    }
    if(it.sid && seenNow[it.sid]){
      it.ok = false; it.note = "名单内学号重复，跳过";
      list.push(it); return;
    }
    if(!it.sid){
      while(usedSid[year + String(autoN).padStart(4, "0")]) autoN++;
      it.sid = year + String(autoN).padStart(4, "0");
      autoN++;
      it.note = "学号自动生成";
    }
    usedSid[it.sid] = 1;
    seenNow[it.sid] = 1;

    /* 名单里带的序号只在空位时沿用，撞上本期已有编号就顺延，避免同一期出现两个 No.01 */
    var wantSeq = r.seq ? parseInt(r.seq, 10) : NaN;
    if(!isNaN(wantSeq) && !usedSeq[wantSeq]){
      it.seq = pad2(wantSeq);
      if(wantSeq > seqN) seqN = wantSeq;
    } else {
      while(usedSeq[++seqN]);
      it.seq = pad2(seqN);
      if(!isNaN(wantSeq)) it.note = it.note ? it.note + " · 序号已顺延" : "序号已顺延";
    }
    usedSeq[parseInt(it.seq, 10)] = 1;

    if(usedName[it.name]) it.note = it.note ? it.note + " · 同批已有同名" : "同批已有同名";
    list.push(it);
  });

  return { batchName: batchName, list: list, status: status, fillFile: fillFile, genActs: genActs };
}

function importMatNote(mid, st, batchName, acts){
  if(st === "missing") return "未提交";
  if(mid === "apply") return "手写原件扫描件";
  if(mid === "report") return "4/4 篇";
  if(mid === "talk") return "2 次谈话记录";
  if(mid === "cultivate") return "第 1—2 季度考察意见";
  if(mid === "cert"){
    var q = (String(batchName).match(/(\d+)\s*期/) || [])[1];
    return q ? ("党校第 " + q + " 期结业") : "党校结业证书";
  }
  var h = acts.reduce(function(s, a){ return s + a.hours; }, 0);
  return acts.length ? (acts.length + " 次 · " + h + " 学时") : "待补录明细";
}

function makeImportActs(){
  var base = new Date();
  return IMPORT_ACTS.map(function(a, i){
    var d = new Date(base.getTime() - (i + 1) * 26 * 86400000);
    return { date: d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()), title: a[0], hours: a[1] };
  }).sort(function(x, y){ return x.date < y.date ? 1 : -1; });
}

function readRosterFile(file, cb){
  var r = new FileReader();
  r.onload = function(){
    var t = String(r.result || "");
    if(t.indexOf("\uFFFD") === -1){ cb(t); return; }
    var r2 = new FileReader();   /* utf-8 出现乱码时按 GBK 重读，兼容 Excel 导出的中文 CSV */
    r2.onload = function(){ cb(String(r2.result || "")); };
    r2.onerror = function(){ cb(t); };
    try{ r2.readAsText(file, "gbk"); }catch(e){ cb(t); }
  };
  r.onerror = function(){ cb(""); };
  try{ r.readAsText(file, "utf-8"); }catch(e){ cb(""); }
}

function appendRosterFiles(files){
  var arr = Array.prototype.slice.call(files).filter(function(f){
    return /\.(txt|csv|tsv|md)$/i.test(f.name) || /^text\//.test(f.type || "");
  });
  if(!arr.length){ toast("请拖入 txt / csv / md 文本名单"); return; }
  var texts = new Array(arr.length), left = arr.length;
  arr.forEach(function(f, i){
    readRosterFile(f, function(t){
      texts[i] = t;
      if(--left) return;
      var box = $("#impText");
      if(!box) return;
      var joined = texts.filter(Boolean).join("\n");
      box.value = (box.value.trim() ? box.value.replace(/\s+$/, "") + "\n" : "") + joined;
      paintRosterPreview();
      toast("已读取 " + arr.length + " 个文件");
    });
  });
}

      '</tr>';
    }).join("") + '</tbody></table></div>';

function doRosterImport(){
  var plan = planRosterImport();
  if(!plan.batchName){ toast("请选择已有期数，或填写新期数名称"); return; }
  var ok = plan.list.filter(function(r){ return r.ok; });
  if(!ok.length){ toast("没有可导入的人员，请检查名单或学号是否重复"); return; }

  var isNewBatch = batchList().indexOf(plan.batchName) < 0;
  if(isNewBatch) DB.meta.batches.push(plan.batchName);

  var today = dateStamp();
  ok.forEach(function(r){
    var acts = plan.genActs ? makeImportActs() : [];
    var mat = {};
    MATERIALS.forEach(function(m){
      var st = plan.status;
      if(m.id === "activity" && plan.genActs && st === "missing") st = "done";
      mat[m.id] = {
        status: st,
        file: (st === "missing" || !plan.fillFile) ? "" : FILE_NAME[m.id],
        note: importMatNote(m.id, st, plan.batchName, acts),
        updatedAt: st === "missing" ? "" : today,
        updatedBy: st === "missing" ? "" : (CFG.user || "系统"),
        files: []
      };
    });
    var np = {
      id: nextPersonId(), seq: r.seq, batch: plan.batchName, name: r.name, sid: r.sid,
      cls: r.cls, phone: r.phone,
      probation: !!r.prob, probationDate: r.prob ? today : "",
      materials: mat, activities: acts
    };
    DB.people.push(np);
    log("批量导入建档", "批次 " + plan.batchName + " · 学号 " + r.sid + " · 六项材料初始为" + ST[plan.status].label, np.id, r.name);
  });

  log("批量导入名单", plan.batchName + " · " + (isNewBatch ? "新建期数，" : "") + "新增 " + ok.length + " 人" +
      (plan.list.length - ok.length ? "，跳过 " + (plan.list.length - ok.length) + " 人" : ""));

  saveAll();
  state.q = "";
  state.batch = plan.batchName;
  closeModal();
  if(location.hash !== "#/persons") location.hash = "#/persons";
  else render();
  toast("已导入 " + ok.length + " 人，整套档案已生成");
}

function importJSON(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var d = JSON.parse(String(reader.result));
      if(!d || !Array.isArray(d.people) || !d.people.length) throw new Error("不是有效的档案快照");
      DB = { meta: d.meta || DB.meta, people: d.people };
      if(Array.isArray(d.logs)) LOGS = d.logs;
      normalize();
      log("导入快照", "导入 " + DB.people.length + " 人档案数据");
      saveAll();
      closeModal();
      render();
      toast("数据快照导入成功，共 " + DB.people.length + " 人");
    }catch(err){
      toast("导入失败：" + (err && err.message ? err.message : "文件格式不正确"));
    }
  };
  reader.readAsText(file, "utf-8");
}
